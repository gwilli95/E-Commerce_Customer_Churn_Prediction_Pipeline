[project]
name = "ecommerce_customer_churn_prediction_pipeline"
version = "0.1.0"
description = "Pipeline to predict e-commerce customer churn from Kaggle dataset API"
authors = [
    { name = "gwilli95", email = "grantrwilliams7@gmail.com" }
]
requires-python = ">=3.10,<3.14"

dependencies = [
    "pandas>=2.3.1,<3.0.0",
    "requests>=2.32.4,<3.0.0",
    "scikit-learn>=1.7.1,<2.0.0",
    "seaborn>=0.13.2,<0.14.0",
    "kaggle>=1.7.4.5,<2.0.0.0",
    "supertree>=0.5.5,<0.6.0"
]

[tool.hatch.build.targets.wheel]
packages = ["churn_pipeline]

[build-system]
requires = ["hatchling>=1.0.0"]
build-backend = "hatchling.build"